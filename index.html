<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>Table - Countries</title>
</head>
<body>
    <h1>Table - Countries</h1>

    <table border="1">
        <caption>List of most populous countries</caption>
        
        <thead>
            <tr>
                <th>Position</th>
                <th>Country</th>
                <th>Approximate population (millions)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>
                    <img src="./imgs/b1.jpg" alt="Flag of China">
                    China
                </td>
                <td>1.440</td>
            </tr>
            <tr>
                <td>2</td>
                <td>
                    <img src="./imgs/b2.jpg" alt="Flag of India">
                    India
                </td>
                <td>1.380</td>
            </tr>
            <tr>
                <td>3</td>
                <td>
                    <img src="./imgs/b3.jpg" alt="Flag of EUA">
                    United States
                </td>
                <td>331</td>
            </tr>

            <tr>
                <td>4</td>
                <td>
                    <img src="./imgs/b4.jpg" alt="Flag of Indonesia">
                    Indonesia
                </td>
                <td>273</td>
            </tr>
            <tr>
                <td>5</td>
                <td>
                    <img src="./imgs/b5.jpg" alt="Flag of Paksitan">
                    Pakistan
                </td>
                <td>220</td>
            </tr>
            <tr>
                <td>6</td>
                <td>
                    <img src="./imgs/b6.jpg" alt="Flag of Brazil">
                    Brazil
                </td>
                <td>212</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">font: fictitious.com</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
